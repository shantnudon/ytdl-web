# Optional single-file binaries, built with Nuitka on GitHub runners.
#
# Runs on a version tag (attaching archives to the GitHub Release) or manually.
# This workflow is independent of the Docker image: a failing binary build never
# blocks the registry push.
name: Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artefact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artefact: ytdlweb-linux-x86_64
          - os: macos-14
            artefact: ytdlweb-macos-arm64
          - os: windows-latest
            artefact: ytdlweb-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build UI
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Install build dependencies
        run: pip install -e ".[binary]" nuitka

      # The frozen binary bundles yt-dlp and ffmpeg (imageio-ffmpeg).
      # It does NOT bundle a JS runtime: install deno or node on the target, or
      # set JS_RUNTIME. Extractors can be refreshed with `ytdlweb update-extractors`.
      - name: Build onefile
        shell: bash
        run: |
          python -m nuitka \
            --onefile --standalone --assume-yes-for-downloads \
            --include-package=app \
            --include-package=yt_dlp --include-package-data=yt_dlp \
            --include-package=imageio_ffmpeg \
            --include-data-dir=app/static=app/static \
            --output-filename=ytdlweb \
            --output-dir=dist \
            packaging/entry.py

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          if [ -f dist/ytdlweb.exe ]; then
            cp dist/ytdlweb.exe "release/${{ matrix.artefact }}.exe"
          else
            cp dist/ytdlweb "release/${{ matrix.artefact }}"
            chmod +x "release/${{ matrix.artefact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artefact }}
          path: release/*
          if-no-files-found: error

  release:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          body: |
            **Docker (recommended)**

            ```bash
            docker pull ghcr.io/${{ github.repository }}:latest
            ```

            **Single-file binaries**

            Archives below bundle yt-dlp and ffmpeg. They need a JavaScript
            runtime (`deno`, `node` or `bun`) on the host for YouTube, and
            extractors can be refreshed without a new download:

            ```bash
            ./ytdlweb update-extractors
            ```

            Verify with `SHA256SUMS.txt`. See the README for configuration.
