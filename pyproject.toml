[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytdlweb"
version = "0.1.0"
description = "Self-hosted yt-dlp web UI with a local music library manager"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ytdlweb contributors" }]
keywords = ["yt-dlp", "youtube", "downloader", "self-hosted", "music", "id3"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "yt-dlp>=2025.1.15",
  "mutagen>=1.47",
  "pydantic-settings>=2.4",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]
binary = ["imageio-ffmpeg>=0.5"]

[project.scripts]
ytdlweb = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yt_dlp".msg = "Import app._ytdlp instead: it applies the extractor plugin path first."
